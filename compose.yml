services:
  # Le point d'entrée public : sert le bundle et proxifie /api vers l'API.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Dimensionnement vertical : un worker Granian par cœur est un bon point de départ.
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    # Pas de `ports` : l'API n'est joignable que par web, à travers le réseau compose.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
