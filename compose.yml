services:
  # The public entrypoint: serves the bundle and proxies /api to the API.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Vertical scaling: one Granian worker per core is a sane starting point.
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    # No `ports`: the API is reachable only by web, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
