# Origine unique : nginx sert le bundle Svelte et proxifie /api vers Litestar. Le
# navigateur ne voit qu'un seul hôte, donc pas de CORS et pas d'URL d'API dans le
# bundle. Front et API restent deux conteneurs qu'on dimensionne séparément.
server {
    # 8080 et non 80 : l'image de base tourne sans privilèges.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite hashe le nom de chaque asset, donc le contenu d'une URL ne change jamais.
    location /assets/ {
        # Un seul en-tête : ajouter `expires` en produirait un second, en doublon.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La doc OpenAPI, servie par Litestar.
    location /schema {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routage SPA : toute autre URL renvoie l'app, qui route côté client. `no-cache`
    # sur ce HTML, sinon un navigateur garderait les anciens noms d'assets hashés et
    # ne verrait jamais un déploiement.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
