name: CI

# Gitflow: validate every PR into and every push to the long-lived branches.
# Feature/release/hotfix branches are covered via their PRs.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Litestar CLI (assets install / generate-types) must load the app to expose
  # the Vite plugin commands; normally set via .env, which is absent in CI.
  LITESTAR_APP: backend.app:app
  PYTHONPATH: .

jobs:
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies (backend + frontend)
        run: just install

      # `just check` starts with check-types, which regenerates openapi.json and
      # fails on any diff: the contract must be committed alongside the handlers.
      - name: Contract check + lint + test
        run: just check

  docker:
    name: Docker build (${{ matrix.image }})
    # main is the release branch, so the heavier image build runs only there.
    # develop (and its PRs) stays light: the `check` job alone.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    # The two images are independent, so they build in parallel and a failure
    # points straight at the side that broke.
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile.${{ matrix.image }} -t litestar-template-${{ matrix.image }}:ci .
