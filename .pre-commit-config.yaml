# Hooks run via `uv run` so versions track pyproject.toml (no rev pin drift).
# Runner: prek (Rust reimplementation of pre-commit). Install hook: `prek install`.
repos:
  - repo: local
    hooks:
      # 1. Format first so the check passes see already-formatted code.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # 2. Autofix + report — applies safe fixes, then fails on anything left unfixed.
      #    A modified file already fails the run, so a separate report pass adds nothing.
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      # 3. Type check — whole project, filenames not passed.
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
